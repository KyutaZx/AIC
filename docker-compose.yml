services:
  ai-engine:
    build: ./ai-engine
    expose:
      - "8001"
    networks:
      - aquaroute-net

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      AI_ENGINE_URL: http://ai-engine:8001
      CORS_ALLOW_ORIGIN: http://localhost:3000
    depends_on:
      - ai-engine
    networks:
      - aquaroute-net

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - aquaroute-net

networks:
  aquaroute-net:
    driver: bridge
